plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Fabric Maven is already included via settings.gradle pluginManagement
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.shedaniel.me/' }           // Cloth Config
    maven { url 'https://maven.terraformersmc.com/releases' } // ModMenu
}

loom {
    accessWidenerPath = file("src/main/resources/burnt.accesswidener")
    mixin { defaultRefmapName = "burnt_fabric-refmap.json" }
}

dependencies {
    // Minecraft + mappings
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    // Fabric Loader
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Cloth Config (config GUI)
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

    // ModMenu (in-game mod list + config screen button)
    modImplementation "com.terraformersmc:modmenu:${modmenu_version}"

    // JSR-305 annotations (@Nullable etc.) — available transitively under NeoForge, needs explicit declaration under Fabric
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Generate a sources jar alongside the binary jar
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
